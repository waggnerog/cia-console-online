name: CIA Campo CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/cia-campo/**"
      - ".github/workflows/cia-campo-ci.yml"
  pull_request:
    paths:
      - "apps/cia-campo/**"
      - ".github/workflows/cia-campo-ci.yml"

permissions:
  contents: read

concurrency:
  group: cia-campo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cia-campo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cia-campo/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --json > audit.json || true

      - name: Enforce security gate
        run: node scripts/security-gate.mjs audit.json

      - name: Verify Expo dependency alignment
        run: npx expo install --check

      - name: Expo doctor
        run: npx expo-doctor

      - name: TypeScript
        run: npm run typecheck

      - name: Export production bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npx expo export --platform android --output-dir dist-ci

      - name: Generate native Android project
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile Android release bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Audit merged Android permissions
        run: |
          MANIFEST="$(find android/app/build/intermediates -type f -name AndroidManifest.xml -path '*release*' | grep -E 'merged_manifest|merged_manifests' | head -n 1)"
          if [ -z "$MANIFEST" ]; then
            echo "Merged release AndroidManifest.xml not found"
            find android/app/build/intermediates -type f -name AndroidManifest.xml -print || true
            exit 1
          fi
          echo "Auditing $MANIFEST"
          node scripts/verify-android-permissions.mjs "$MANIFEST"

      - name: Upload Android compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: cia-campo-android-release-compile
          path: apps/cia-campo/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Play assets
        uses: actions/upload-artifact@v4
        with:
          name: cia-campo-play-assets
          path: |
            apps/cia-campo/store/play-icon-512.png
            apps/cia-campo/store/feature-graphic-1024x500.png
            apps/cia-campo/store/screenshot-*.png
          if-no-files-found: error

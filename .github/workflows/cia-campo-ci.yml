name: CIA Campo CI

on:
  push:
    branches:
      - main
      - feat/cia-campo-android
    paths:
      - "apps/cia-campo/**"
      - ".github/workflows/cia-campo-ci.yml"
  pull_request:
    paths:
      - "apps/cia-campo/**"
      - ".github/workflows/cia-campo-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cia-campo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Upload generated package-lock
        uses: actions/upload-artifact@v4
        with:
          name: cia-campo-package-lock
          path: apps/cia-campo/package-lock.json
          if-no-files-found: error

      - name: Audit production dependencies
        run: npm audit --omit=dev --json > audit.json || true

      - name: Enforce security gate
        run: node scripts/security-gate.mjs audit.json

      - name: Verify Expo dependency alignment
        run: npx expo install --check

      - name: Expo doctor
        run: npx expo-doctor

      - name: TypeScript
        run: npm run typecheck

      - name: Export production bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npx expo export --platform android --output-dir dist-ci

      - name: Generate native Android project
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile Android release bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Upload Android compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: cia-campo-android-release-compile
          path: apps/cia-campo/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Play assets
        uses: actions/upload-artifact@v4
        with:
          name: cia-campo-play-assets
          path: |
            apps/cia-campo/store/play-icon-512.png
            apps/cia-campo/store/feature-graphic-1024x500.png
            apps/cia-campo/store/screenshot-*.png
          if-no-files-found: error

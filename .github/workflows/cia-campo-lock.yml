name: CIA Campo Lockfile

on:
  push:
    branches:
      - feat/cia-campo-android
    paths:
      - "apps/cia-campo/package.json"
      - ".github/workflows/cia-campo-lock.yml"

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cia-campo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cia-campo-package-lock
          path: apps/cia-campo/package-lock.json
          if-no-files-found: error

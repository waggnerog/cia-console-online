name: Temporary Human Reference Audit

on:
  push:
    paths:
      - ".github/workflows/ref-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch reference and inspect design tokens
        shell: bash
        run: |
          set -euo pipefail
          URL="https://black.humanacademy.ai/black-2026"
          mkdir -p /tmp/human-ref
          curl -L --compressed -A "Mozilla/5.0" "$URL" -o /tmp/human-ref/page.html
          echo "=== HTML HEAD / STYLES ==="
          python - <<'PY'
          from pathlib import Path
          import re, html
          s=Path('/tmp/human-ref/page.html').read_text(errors='ignore')
          print(s[:12000])
          css=re.findall(r'<link[^>]+href=["\']([^"\']+\.css[^"\']*)["\']', s, re.I)
          print("\nCSS_LINKS")
          for x in css: print(x)
          fonts=re.findall(r'(?:font-family|--[^:]*font[^:]*):\s*([^;}]+)', s, re.I)
          print("\nINLINE_FONT_HINTS")
          for x in sorted(set(fonts)): print(x[:200])
          PY
          python - <<'PY'
          from pathlib import Path
          import re, urllib.parse
          s=Path('/tmp/human-ref/page.html').read_text(errors='ignore')
          css=re.findall(r'<link[^>]+href=["\']([^"\']+\.css[^"\']*)["\']', s, re.I)
          for i,u in enumerate(css):
              print(f"CSS_URL_{i}={urllib.parse.urljoin('https://black.humanacademy.ai/black-2026',u)}")
          PY
          python - <<'PY' > /tmp/human-ref/css_urls.txt
          from pathlib import Path
          import re, urllib.parse
          s=Path('/tmp/human-ref/page.html').read_text(errors='ignore')
          for u in re.findall(r'<link[^>]+href=["\']([^"\']+\.css[^"\']*)["\']', s, re.I):
              print(urllib.parse.urljoin('https://black.humanacademy.ai/black-2026',u))
          PY
          n=0
          while IFS= read -r css; do
            [ -z "$css" ] && continue
            echo "Fetching $css"
            curl -L --compressed -A "Mozilla/5.0" "$css" -o "/tmp/human-ref/style-$n.css"
            n=$((n+1))
          done < /tmp/human-ref/css_urls.txt
          cat /tmp/human-ref/style-*.css > /tmp/human-ref/all.css 2>/dev/null || true
          echo "=== FONT FACE ==="
          grep -Eo '@font-face\{[^}]+\}' /tmp/human-ref/all.css | head -80 || true
          echo "=== FONT FAMILY TOKENS ==="
          grep -Eo 'font-family:[^;}]+' /tmp/human-ref/all.css | sort -u | head -120 || true
          echo "=== CSS CUSTOM PROPERTIES ==="
          grep -Eo -- '--[A-Za-z0-9_-]+:[^;}]+' /tmp/human-ref/all.css | grep -Ei 'color|bg|background|font|text|accent|black|white|purple|green|yellow|orange|blue|cream' | sort -u | head -200 || true
          echo "=== HEX COLORS BY FREQUENCY ==="
          python - <<'PY'
          from pathlib import Path
          import re, collections
          s=Path('/tmp/human-ref/all.css').read_text(errors='ignore')
          c=collections.Counter(x.lower() for x in re.findall(r'#[0-9a-fA-F]{3,8}\b',s))
          for k,v in c.most_common(80): print(v,k)
          print("\nFONT NAMES FROM @font-face")
          for fam in sorted(set(re.findall(r'font-family:\s*["\']?([^;"\'}]+)',s,re.I))):
              print(fam.strip()[:160])
          PY
